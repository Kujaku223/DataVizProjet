<mat-toolbar>
  <button mat-icon-button (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">
    {{ title }}
  </span>

  <span class="spacer"></span>

  @for (page of pages; track page.name) {
    <button mat-button (click)="scrollTo(page.anchor)">
      {{ page.name }}
    </button>
  }
</mat-toolbar>
